<header class="kz-topbar">
    <button type="button" class="btn btn-sm btn-outline-secondary kz-topbar-toggle" id="kzSidebarToggle" aria-label="Toggle navigation" aria-controls="kzSidebar" aria-expanded="false">
        <i class="bi bi-list fs-5"></i>
    </button>

    <nav class="kz-breadcrumb" aria-label="Breadcrumb">
        {% block breadcrumb %}{% endblock %}
    </nav>

    <div class="ms-auto d-flex align-items-center gap-2">
        {% block topbar_actions %}{% endblock %}

        {% if current_tenant %}
        <span class="badge text-bg-light border d-none d-sm-inline-flex align-items-center gap-1">
            <i class="bi bi-building"></i> {{ current_tenant.name }}
        </span>
        {% endif %}

        {% if user.is_authenticated %}
        <div class="dropdown">
            <button class="btn btn-sm btn-light border d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="kz-avatar">{{ user.email|slice:":1"|upper }}</span>
                <span class="d-none d-md-inline">{{ user.email }}</span>
                <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'accounts:mfa-status' %}"><i class="bi bi-shield-lock me-2"></i>Security</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
        {% else %}
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'accounts:login' %}">Sign in</a>
        <a class="btn btn-sm btn-primary" href="{% url 'tenants:onboard' %}">Register institution</a>
        {% endif %}
    </div>
</header>
