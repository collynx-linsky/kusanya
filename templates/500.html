<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUSANYA — Something went wrong</title>
    <style>
        /* Deliberately self-contained -- no static file, CDN, or
           context-processor dependency. Django renders this template
           with a bare Context (no request, no context processors) in
           production, and it may render during an outage of the very
           infrastructure (static files, database-backed context) that
           the rest of the app depends on. See ARCHITECTURE_DECISIONS
           ADR-033 and docs/DESIGN_SYSTEM.md. */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            padding: 5rem 1.5rem;
            color: #0f172a;
            background: #f8fafc;
        }
        .code { font-size: 2.5rem; font-weight: 700; color: #1f6e4a; margin-bottom: 0.5rem; }
        p { color: #64748b; }
    </style>
</head>
<body>
    <div class="code">500</div>
    <p>Something went wrong on our end. The incident has been logged.</p>
</body>
</html>
