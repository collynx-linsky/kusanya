{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block breadcrumb %}
<a href="{% url 'customers:list' %}">Customers</a>
<i class="bi bi-chevron-right small"></i>
<span class="text-body">{{ title }}</span>
{% endblock %}
{% block content %}
<div class="kz-page-header">
    <h1 class="kz-page-title">{{ title }}</h1>
</div>

<div class="kz-form-card">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="kz-form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'customers:list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
